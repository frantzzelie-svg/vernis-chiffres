<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vernis & Chiffres – compta des prothésistes ongulaires</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf5fa;--surf:#fff;--ink:#2a1530;--mut:#7d6585;--acc:#b0307f;--acc2:#e9c6dd;--ok:#1f7a5a;--warn:#c27a00;--bad:#c0392b;--line:#ead9e5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b0f20;--surf:#2a1830;--ink:#f6e9f3;--mut:#b99ec2;--acc:#ff7ac3;--acc2:#4a2850;--ok:#4fd1a1;--warn:#ffb84d;--bad:#ff7a6b;--line:#43294a}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.45;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:20px 16px}
h1{font-size:1.5rem;font-weight:800;margin:0 0 4px}h2{font-size:1.05rem;margin:22px 0 10px}
p.sub{color:var(--mut);margin:0 0 18px}
.hero{background:var(--acc);color:#fff;border-radius:22px 22px 22px 4px;padding:20px}
.hero small{opacity:.85}.hero .big{font-size:2.4rem;font-weight:800;line-height:1.1}
.row{display:flex;gap:10px}.row>*{flex:1}
.box{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.box b{display:block;font-size:1.25rem}.box span{color:var(--mut);font-size:.85rem}
.bar{height:12px;background:var(--acc2);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .4s}
label{display:block;font-weight:600;margin:14px 0 6px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--surf);border:1.5px solid var(--line);border-radius:12px;padding:12px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1.5px solid var(--acc);background:none;color:var(--acc);font:inherit;border-radius:20px;padding:8px 14px;cursor:pointer}
.chip.on{background:var(--acc);color:#fff}
.btn{width:100%;margin-top:18px;background:var(--ink);color:var(--bg);border:0;border-radius:14px;padding:15px;font:inherit;font-weight:800;cursor:pointer}
.btn.light{background:none;color:var(--bad);border:1.5px solid var(--bad);margin-top:10px}
ul{list-style:none;padding:0;margin:0}
li{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
li small{display:block;color:var(--mut)}li .x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:1.1rem}
.pos{color:var(--ok);font-weight:600}.neg{color:var(--bad);font-weight:600}
.note{font-size:.8rem;color:var(--mut);margin-top:14px}.empty{color:var(--mut);padding:14px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1 0 auto;background:none;border:0;font:inherit;color:var(--mut);padding:14px 11px;white-space:nowrap;cursor:pointer;font-size:.76rem}
nav button.on{color:var(--acc);font-weight:800}
nav{overflow-x:auto}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center}.cal b{font-size:.75rem;color:var(--mut);font-weight:600}.day{position:relative;aspect-ratio:1;border:0;border-radius:10px;background:var(--surf);color:var(--ink);font:inherit;cursor:pointer}.day.td{outline:2px solid var(--acc2)}.day.on{background:var(--acc);color:#fff}.day i{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--acc)}.day.on i{background:#fff}.mh{display:flex;align-items:center;justify-content:space-between;text-transform:capitalize}.mh button{background:none;border:0;color:var(--ink);font-size:1.5rem;padding:6px 14px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast" role="status"></div>
<nav id="nav"></nav>
<script>
var TABS=[['home','Accueil'],['ag','Agenda'],['inc','+ Presta'],['exp','+ Dépense'],['cli','Clientes'],['mar','Marges'],['set','Réglages']];
var PRESETS=[['Pose gel',55],['Remplissage',45],['Semi-permanent',35],['Nail art',10],['Dépose',15]];
var CATS=['Produits (gels, vernis)','Matériel (lampe, fraise)','Loyer / location','Formation','Pub / réseaux','Autre'];
var tab='home',kind='',st={inc:[],exp:[],cli:[],serv:null,rdv:[],freq:'m',me:{n:'',a:'',s:''},invn:0,msg:'Bonjour {nom}, ça fait un moment ! Envie de rafraîchir vos ongles ? J’ai des créneaux cette semaine.',ceil:83600,rate:21.2};
try{var s=localStorage.getItem('vc');if(s)st=Object.assign(st,JSON.parse(s))}catch(e){}
if(!st.serv)st.serv=PRESETS.map(function(p,i){return{id:i+1,n:p[0],p:p[1],c:3,m:60}});
function save(){try{localStorage.setItem('vc',JSON.stringify(st))}catch(e){}}
function eur(n){return n.toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2})}
function today(){return iso(new Date())}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sum(a){return a.reduce(function(t,x){return t+x.amt},0)}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.className='toast show';setTimeout(function(){t.className='toast'},1800)}
function go(t){tab=t;render();window.scrollTo(0,0)}
function render(){
 document.getElementById('nav').innerHTML=TABS.map(function(t){return '<button class="'+(t[0]==tab?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');
 document.getElementById('app').innerHTML=({home:home,inc:incForm,exp:expForm,cli:clients,ag:agenda,mar:margins,set:settings})[tab]();
}
function home(){
 var ym=today().slice(0,7),yr=today().slice(0,4);
 var mi=sum(st.inc.filter(function(x){return x.d.slice(0,7)==ym})),me=sum(st.exp.filter(function(x){return x.d.slice(0,7)==ym}));
 var yi=sum(st.inc.filter(function(x){return x.d.slice(0,4)==yr}));
 var pct=Math.min(100,yi/st.ceil*100),left=Math.max(0,st.ceil-yi),cot=mi*st.rate/100;
 var cls=pct>=90?'var(--bad)':pct>=70?'var(--warn)':'var(--ok)';
 var all=st.inc.map(function(x){return{k:'i',x:x}}).concat(st.exp.map(function(x){return{k:'e',x:x}})).sort(function(a,b){return b.x.d<a.x.d?-1:1}).slice(0,8);
 return '<h1>Bonjour 💅</h1><p class="sub">Voici votre mois en un coup d’œil.</p>'+
 '<div class="hero"><small>Bénéfice du mois (avant cotisations)</small><div class="big">'+eur(mi-me)+'</div></div>'+
 '<div class="row"><div class="box"><span>Chiffre d’affaires</span><b class="pos">'+eur(mi)+'</b></div><div class="box"><span>Dépenses</span><b class="neg">'+eur(me)+'</b></div></div>'+
 '<div class="box"><span>Cotisations URSSAF à prévoir ce mois-ci ('+st.rate+' %)</span><b>'+eur(cot)+'</b><span>Reste après cotisations et dépenses : '+eur(mi-me-cot)+'</span></div>'+
 alerts()+'<h2>Plafond micro-entreprise '+yr+'</h2><div class="box" style="margin-top:0"><b>'+eur(yi)+' <span>sur '+eur(st.ceil)+'</span></b><div class="bar"><i style="width:'+pct+'%;background:'+cls+'"></i></div><span>Il vous reste '+eur(left)+' avant le plafond ('+pct.toFixed(0)+' % atteint).'+(pct>=70?' Pensez à anticiper la sortie du régime.':'')+'</span></div>'+
 '<h2>Derniers mouvements</h2>'+(all.length?'<ul>'+all.map(function(m){return '<li><div>'+esc(m.x.l)+'<small>'+new Date(m.x.d).toLocaleDateString('fr-FR')+'</small></div><span class="'+(m.k=='i'?'pos':'neg')+'">'+(m.k=='i'?'+':'−')+eur(m.x.amt)+'</span></li>'}).join('')+'</ul>':'<p class="empty">Rien pour l’instant. Ajoutez votre première prestation.</p>');
}
function pick(v,a){kind=v;document.getElementById('lab').value=v;if(a!=null)document.getElementById('amt').value=a;var c=document.querySelectorAll('.chip');for(var i=0;i<c.length;i++)c[i].className='chip'+(c[i].dataset.v==v?' on':'')}
function incForm(){
 return '<h1>Nouvelle prestation</h1><p class="sub">Touchez une prestation, ajustez le prix, c’est noté.</p><div class="chips">'+
 st.serv.map(function(p){return '<button class="chip" data-v="'+esc(p.n)+'" onclick="'+(delB?'delServ('+p.id+')':'pickS('+p.id+')')+'" style="'+(delB?'border-color:var(--bad);color:var(--bad)':'')+'">'+(delB?'✕ ':'')+esc(p.n)+'</button>'}).join('')+'<button class="chip" style="border-style:dashed" onclick="newS=!newS;delB=false;render()">+ Ajouter</button><button class="chip" style="border-style:dashed" onclick="delB=!delB;newS=false;render()">'+(delB?'Terminé':'Supprimer')+'</button>'+'</div>'+
 (delB?'<p class="note">Touchez une bulle pour la supprimer. Les prestations déjà enregistrées restent dans votre chiffre d’affaires.</p>':'')+(newS?'<div class="box"><b style="font-size:1rem">Nouvelle bulle</b><label for="sn2">Nom du soin</label><input id="sn2" placeholder="Ex. Babyboomer"><label for="sp2">Prix habituel (€)</label><input id="sp2" type="number" inputmode="decimal" min="0" step="0.5"><button class="btn" onclick="addBulle()">Ajouter à mes prestations</button></div>':'')+
 '<label for="lab">Prestation</label><input id="lab" placeholder="Ex. Pose gel + nail art">'+
 '<label for="amt">Prix encaissé (€)</label><input id="amt" type="number" inputmode="decimal" min="0" step="0.5">'+
 '<label for="dt">Date</label><input id="dt" type="date" value="'+today()+'">'+
 '<label for="cl">Cliente (facultatif)</label><select id="cl"><option value="">Aucune</option>'+st.cli.map(function(c){return '<option value="'+c.id+'">'+esc(c.n)+'</option>'}).join('')+'</select>'+
 '<button class="btn" onclick="add(\'inc\')">Enregistrer la prestation</button>'+list('inc');
}
function expForm(){
 return '<h1>Nouvelle dépense</h1><p class="sub">Gardez aussi la facture en photo, vous en aurez besoin.</p>'+
 '<label for="lab">Catégorie</label><select id="lab">'+CATS.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select>'+
 '<label for="amt">Montant (€)</label><input id="amt" type="number" inputmode="decimal" min="0" step="0.5">'+
 '<label for="dt">Date</label><input id="dt" type="date" value="'+today()+'">'+
 '<button class="btn" onclick="add(\'exp\')">Enregistrer la dépense</button>'+list('exp');
}
function list(k){
 var a=st[k].slice().sort(function(x,y){return y.d<x.d?-1:1}).slice(0,6);
 return '<h2>Dernières saisies</h2>'+(a.length?'<ul>'+a.map(function(x){return '<li><div>'+esc(x.l)+'<small>'+new Date(x.d).toLocaleDateString('fr-FR')+'</small></div><span>'+eur(x.amt)+' '+(k=='inc'?'<button class="chip" onclick="invoice('+x.id+')">Facture</button> ':'')+'<button class="x" aria-label="Supprimer" onclick="del(\''+k+'\','+x.id+')">✕</button></span></li>'}).join('')+'</ul>':'<p class="empty">Aucune saisie pour l’instant.</p>');
}
function add(k){
 var l=document.getElementById('lab').value.trim(),a=parseFloat(document.getElementById('amt').value),d=document.getElementById('dt').value||today();
 if(!l||!(a>0)){toast('Indiquez un libellé et un montant');return}
 var o={id:Date.now(),l:l,amt:a,d:d},cs=document.getElementById('cl');if(k=='inc'&&cs&&cs.value)o.c=+cs.value;st[k].push(o);save();toast(k=='inc'?'Prestation enregistrée':'Dépense enregistrée');render();
}
function del(k,id){st[k]=st[k].filter(function(x){return x.id!=id});save();render()}
function settings(){
 return '<h1>Réglages</h1><p class="sub">Vérifiez ces valeurs sur autoentrepreneur.urssaf.fr, elles évoluent.</p>'+
 '<label for="ce">Plafond annuel de CA (€)</label><input id="ce" type="number" value="'+st.ceil+'">'+
 '<label for="ra">Taux de cotisations (%)</label><input id="ra" type="number" step="0.1" value="'+st.rate+'">'+
 '<label for="fq">Déclaration URSSAF</label><select id="fq" onchange="st.freq=this.value;save()"><option value="m"'+(st.freq=='m'?' selected':'')+'>Chaque mois</option><option value="q"'+(st.freq=='q'?' selected':'')+'>Chaque trimestre</option></select>'+
 '<h2>Mes infos pour les factures</h2><label for="in">Nom ou nom commercial</label><input id="in" value="'+esc(st.me.n)+'" onchange="st.me.n=this.value.trim();save()"><label for="ia">Adresse</label><input id="ia" value="'+esc(st.me.a)+'" onchange="st.me.a=this.value.trim();save()"><label for="is">Numéro SIRET</label><input id="is" inputmode="numeric" value="'+esc(st.me.s)+'" onchange="st.me.s=this.value.trim();save()">'+
 '<button class="btn" onclick="st.ceil=+document.getElementById(\'ce\').value||st.ceil;st.rate=+document.getElementById(\'ra\').value||st.rate;save();toast(\'Réglages enregistrés\');go(\'home\')">Enregistrer les réglages</button>'+
 '<button class="btn light" onclick="if(confirm(\'Effacer toutes les données ?\')){st.inc=[];st.exp=[];st.cli=[];st.rdv=[];save();go(\'home\')}">Effacer mes données</button>'+
 '<p class="note">Valeurs par défaut : micro-entreprise en prestations de services (BIC), plafond 83 600 €, cotisations 21,2 %. Cette version de démonstration enregistre les données uniquement sur votre appareil. Estimation indicative, pas un conseil comptable.</p>';
}
function pickS(id){var s=st.serv.filter(function(x){return x.id==id})[0];if(s)pick(s.n,s.p)}
function daysAgo(d){return Math.floor((new Date(today())-new Date(d))/864e5)}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function nextDue(){
 var n=new Date(),y=n.getFullYear(),m=n.getMonth(),t0=new Date(y,m,n.getDate()),c=[],r;
 if(st.freq=='q'){
  for(var yy=y;yy<=y+1;yy++)c.push({due:new Date(yy,0,31),f:new Date(yy-1,9,1),t:new Date(yy-1,11,31)},{due:new Date(yy,3,30),f:new Date(yy,0,1),t:new Date(yy,2,31)},{due:new Date(yy,6,31),f:new Date(yy,3,1),t:new Date(yy,5,30)},{due:new Date(yy,9,31),f:new Date(yy,6,1),t:new Date(yy,8,30)});
  r=c.filter(function(x){return x.due>=t0})[0];
 }else r={due:new Date(y,m+1,0),f:new Date(y,m-1,1),t:new Date(y,m,0)};
 return{due:r.due,f:iso(r.f),t:iso(r.t),j:Math.round((r.due-t0)/864e5),l:st.freq=='q'?'CA du '+r.f.toLocaleDateString('fr-FR')+' au '+r.t.toLocaleDateString('fr-FR'):'CA de '+r.f.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})};
}
function stats(c){var v=st.inc.filter(function(x){return x.c==c.id}).sort(function(a,b){return b.d<a.d?-1:1});return{n:v.length,t:sum(v),last:v.length?v[0].d:null}}
function relance(){return st.cli.filter(function(c){var s=stats(c);return s.last&&daysAgo(s.last)>=35})}
function alerts(){
 var u=nextDue(),ca=sum(st.inc.filter(function(x){return x.d>=u.f&&x.d<=u.t})),r=relance(),col=u.j<=7?'var(--bad)':u.j<=14?'var(--warn)':'var(--ok)';
 var h='<div class="box" style="border-left:5px solid '+col+'"><span>Prochaine déclaration URSSAF – '+u.l+'</span><b>'+(u.j==0?'Aujourd’hui':'Dans '+u.j+' jour'+(u.j>1?'s':''))+'</b><span>À faire avant le '+u.due.toLocaleDateString('fr-FR')+'. CA à déclarer : '+eur(ca)+', cotisations estimées : '+eur(ca*st.rate/100)+'.</span></div>';
 if(r.length)h+='<div class="box" style="border-left:5px solid var(--warn)"><b>'+r.length+' cliente'+(r.length>1?'s':'')+' à relancer</b><span>'+r.slice(0,3).map(function(c){return esc(c.n)}).join(', ')+(r.length>3?'…':'')+'. Détails dans l’onglet Clientes.</span></div>';
 var tr=st.rdv.filter(function(x){return x.d==today()}).sort(function(a,b){return a.h<b.h?-1:1}),lt=st.rdv.filter(function(x){return x.d<today()}).length;
 if(tr.length)h='<div class="box" style="border-left:5px solid var(--acc)"><b>Aujourd’hui : '+tr.length+' rendez-vous</b><span>'+tr.slice(0,3).map(function(x){return x.h+' '+esc(x.n)}).join(', ')+'</span></div>'+h;
 if(lt)h+='<div class="box" style="border-left:5px solid var(--warn)"><b>'+lt+' rendez-vous à valider</b><span>Appuyez sur Terminé dans l’Agenda pour les encaisser.</span></div>';
 return h;
}
function clients(){
 var e=st.cli.filter(function(c){return c.id==ecl})[0]||{};
 return '<h1>Mes clientes</h1><p class="sub">Sans visite depuis 5 semaines, une cliente passe en « à relancer ».</p>'+
 '<label for="mg">Mon message de relance</label><textarea id="mg" rows="3" style="width:100%;font:inherit;color:var(--ink);background:var(--surf);border:1.5px solid var(--line);border-radius:12px;padding:12px" onchange="st.msg=this.value;save();toast(\'Message enregistré\')">'+esc(st.msg)+'</textarea><p class="note">{nom} est remplacé par le prénom de la cliente. Le bouton Relancer copie ce message : collez-le ensuite dans WhatsApp, Instagram ou SMS.</p><h2>'+(ecl?'Modifier la cliente':'Ajouter une cliente')+'</h2>'+
 '<label for="cn">Prénom ou nom</label><input id="cn" placeholder="Ex. Léa M." value="'+esc(e.n||'')+'">'+
 '<label for="ct">Téléphone (facultatif)</label><input id="ct" type="tel" value="'+esc(e.t||'')+'">'+
 '<label for="ca">Adresse (pour les factures)</label><input id="ca" value="'+esc(e.a||'')+'"><label style="display:flex;gap:8px;align-items:center"><input id="cp" type="checkbox" style="width:auto"'+(e.p?' checked':'')+'> Cliente professionnelle (elle paie pour son activité)</label>'+
 '<button class="btn" onclick="addCli()">'+(ecl?'Enregistrer les modifications':'Ajouter la cliente')+'</button><h2>Liste</h2>'+
 (st.cli.length?'<ul>'+st.cli.map(function(c){var s=stats(c),old=s.last&&daysAgo(s.last)>=35,msg='Bonjour '+c.n+', ça fait un moment ! Envie de rafraîchir vos ongles ? J’ai des créneaux cette semaine.';
  return '<li><div>'+esc(c.n)+'<small>'+s.n+' visite'+(s.n>1?'s':'')+' – '+eur(s.t)+(s.last?' – dernière il y a '+daysAgo(s.last)+' j':' – pas encore de visite')+'</small></div><span>'+(old?'<button class="chip" onclick="copyMsg('+c.id+')">Relancer</button> ':'')+'<button class="chip" onclick="editCli('+c.id+')">Modifier</button> <button class="x" aria-label="Supprimer" onclick="delCli('+c.id+')">✕</button></span></li>'}).join('')+'</ul>':'<p class="empty">Ajoutez vos clientes habituelles, puis choisissez-les à chaque prestation.</p>');
}
function copyMsg(id){var c=st.cli.filter(function(x){return x.id==id})[0];if(!c)return;var m=(st.msg||'').split('{nom}').join(c.n);
 var ok=function(){toast('Message copié')};
 var fb=function(){var t=document.createElement('textarea');t.value=m;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(e){toast('Copie impossible')}document.body.removeChild(t)};
 try{navigator.clipboard.writeText(m).then(ok,fb)}catch(e){fb()}}
var ecl=null;function editCli(id){ecl=id;render();window.scrollTo(0,0)}
function addCli(){var n=document.getElementById('cn').value.trim();if(!n){toast('Indiquez un prénom');return}var o={n:n,t:document.getElementById('ct').value.trim(),a:document.getElementById('ca').value.trim(),p:document.getElementById('cp').checked},e=st.cli.filter(function(c){return c.id==ecl})[0];if(e)Object.assign(e,o);else st.cli.push(Object.assign({id:Date.now()},o));ecl=null;save();toast(e?'Cliente modifiée':'Cliente ajoutée');render()}
function delCli(id){st.cli=st.cli.filter(function(c){return c.id!=id});save();render()}
function fld(id,k,lab,v){return '<div><span>'+lab+'</span><input type="number" inputmode="decimal" min="0" step="0.5" value="'+v+'" aria-label="'+lab+'" onchange="upd('+id+',\''+k+'\',this.value)"></div>'}
function upd(id,k,v){var s=st.serv.filter(function(x){return x.id==id})[0];if(s){s[k]=Math.max(0,parseFloat(v)||0);save();render()}}
function margins(){
 return '<h1>Rentabilité</h1><p class="sub">Saisissez prix, coût des produits et durée : voyez ce qu’une prestation vous rapporte vraiment.</p>'+
 st.serv.map(function(s){var g=s.p-s.c,hr=s.m>0?g/s.m*60:0,col=hr>=25?'var(--ok)':hr>=15?'var(--warn)':'var(--bad)';
  return '<div class="box"><div style="display:flex;justify-content:space-between"><b>'+esc(s.n)+'</b><button class="x" aria-label="Supprimer cette prestation" onclick="delServ('+s.id+')">✕</button></div><div class="row">'+fld(s.id,'p','Prix €',s.p)+fld(s.id,'c','Produits €',s.c)+fld(s.id,'m','Durée min',s.m)+'</div><p style="margin:12px 0 0">Il vous reste <b style="display:inline;color:'+col+'">'+eur(g)+'</b>, soit <b style="display:inline;color:'+col+'">'+eur(hr)+' par heure</b>.</p></div>'}).join('')+
 '<label for="sn">Nouvelle prestation</label><input id="sn" placeholder="Ex. Babyboomer"><button class="btn" onclick="addServ()">Ajouter la prestation</button>'+
 '<p class="note">Repères : vert à partir de 25 € par heure, orange entre 15 et 25. Montants avant cotisations et hors frais fixes (loyer, matériel).</p>';
}
function pdfn(n){return n.toFixed(2).replace('.',',')+' EUR'}
function fr(s){return new Date(s).toLocaleDateString('fr-FR')}
async function invoice(id){
 var x=st.inc.filter(function(v){return v.id==id})[0];if(!x)return;
 if(!st.me.n||!st.me.s){toast('Remplissez vos infos dans Réglages');return}
 if(!window.jspdf){toast('Générateur PDF indisponible');return}
 var dl=null;try{dl=window.claude?await window.claude.use('downloads'):null}catch(e){}
 
 if(!x.inv){st.invn=(st.invn||0)+1;x.inv=st.invn;save()}
 var cl=st.cli.filter(function(c){return c.id==x.c})[0],no=x.d.slice(0,4)+'-'+String(x.inv).padStart(4,'0');
 var d=new jspdf.jsPDF({unit:'mm',format:'a4'}),L=20,y=26,T=function(t,a,b,o){d.text(t,a,b,o)};
 d.setFont('helvetica','bold');d.setFontSize(22);T('FACTURE',L,y);
 d.setFont('helvetica','normal');d.setFontSize(10);T('N° '+no,190,y-6,{align:'right'});T('Émise le '+fr(today()),190,y,{align:'right'});
 y+=16;d.setFont('helvetica','bold');T(st.me.n+' (EI)',L,y);d.setFont('helvetica','normal');
 var ad=d.splitTextToSize(st.me.a||'',80),y2=y+5;if(ad.length){T(ad,L,y2);y2+=ad.length*5}
 T('SIRET : '+st.me.s,L,y2);
 d.setFont('helvetica','bold');T('Facturé à',125,y);d.setFont('helvetica','normal');T(cl?cl.n:'Cliente',125,y+5);var ca=d.splitTextToSize(cl&&cl.a?cl.a:'',65);if(ca.length){T(ca,125,y+10);y2=Math.max(y2,y+10+ca.length*5)}
 y=y2+16;d.setFillColor(176,48,127);d.rect(L,y,170,8,'F');d.setTextColor(255);T('Désignation',L+2,y+5.5);T('Qté',125,y+5.5,{align:'right'});T('Prix unitaire',155,y+5.5,{align:'right'});T('Montant',188,y+5.5,{align:'right'});d.setTextColor(0);
 y+=16;var ds=d.splitTextToSize(x.l+' - prestation du '+fr(x.d),95);T(ds,L+2,y);T('1',125,y,{align:'right'});T(pdfn(x.amt),155,y,{align:'right'});T(pdfn(x.amt),188,y,{align:'right'});
 y+=ds.length*5;d.line(L,y,190,y);y+=9;d.setFont('helvetica','bold');T('Total à payer',L+2,y);T(pdfn(x.amt),188,y,{align:'right'});
 d.setFont('helvetica','normal');d.setFontSize(9);y+=18;T('Nature de l\'opération : prestation de services.',L,y);T('TVA non applicable, article 293 B du CGI.',L,y+5);T('Règlement à réception de la facture.',L,y+10);if(cl&&cl.p){T('Pénalités de retard : 3 fois le taux d\'intérêt légal. Indemnité forfaitaire de recouvrement : 40 EUR.',L,y+15);T('Pas d\'escompte pour paiement anticipé.',L,y+20)}
 try{if(dl)await dl.save({filename:'facture-'+no+'.pdf',data:d.output('arraybuffer')});else d.save('facture-'+no+'.pdf');toast('Facture enregistrée')}catch(e){if(!e||e.code!='declined')toast('Enregistrement impossible')}
}
var ag={m:new Date(new Date().getFullYear(),new Date().getMonth(),1),s:today()};
function agMove(n){ag.m=new Date(ag.m.getFullYear(),ag.m.getMonth()+n,1);render()}
function agSel(d){ag.s=d;render()}
function rdvRow(r){return '<li><div><b style="display:inline">'+r.h+'</b> '+esc(r.n)+'<small>'+(r.d<today()?fr(r.d)+' – ':'')+esc(r.l)+' – '+eur(r.amt)+'</small></div><span><button class="chip" onclick="rdvDone('+r.id+')">Terminé</button> <button class="x" aria-label="Supprimer" onclick="rdvDel('+r.id+')">✕</button></span></li>'}
function agenda(){
 var y=ag.m.getFullYear(),mo=ag.m.getMonth(),first=(new Date(y,mo,1).getDay()+6)%7,nd=new Date(y,mo+1,0).getDate(),cells='',i,k;
 for(i=0;i<first;i++)cells+='<span></span>';
 for(k=1;k<=nd;k++){var ds=iso(new Date(y,mo,k)),n=st.rdv.filter(function(r){return r.d==ds}).length;cells+='<button class="day'+(ds==ag.s?' on':'')+(ds==today()?' td':'')+'" onclick="agSel(\''+ds+'\')">'+k+(n?'<i></i>':'')+'</button>'}
 var hd=['L','M','M','J','V','S','D'].map(function(x){return '<b>'+x+'</b>'}).join(''),
  day=st.rdv.filter(function(r){return r.d==ag.s}).sort(function(a,b){return a.h<b.h?-1:1}),
  late=st.rdv.filter(function(r){return r.d<today()}).sort(function(a,b){return a.d<b.d?-1:1});
 return '<h1>Agenda</h1><div class="mh"><button aria-label="Mois précédent" onclick="agMove(-1)">‹</button><b>'+ag.m.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})+'</b><button aria-label="Mois suivant" onclick="agMove(1)">›</button></div><div class="cal">'+hd+cells+'</div>'+
 (late.length?'<h2>À valider</h2><ul>'+late.map(rdvRow).join('')+'</ul>':'')+
 '<h2 style="text-transform:capitalize">'+new Date(ag.s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+'</h2>'+(day.length?'<ul>'+day.map(rdvRow).join('')+'</ul>':'<p class="empty">Aucun rendez-vous ce jour-là.</p>')+rdvForm();
}
function rdvForm(){
 return '<h2>Nouveau rendez-vous</h2><label for="rp">Prestation</label><select id="rp" onchange="rdvPrice()">'+st.serv.map(function(s){return '<option value="'+s.id+'">'+esc(s.n)+'</option>'}).join('')+'</select>'+
 '<label for="rc">Cliente</label><select id="rc"><option value="">Autre (je tape son nom)</option>'+st.cli.map(function(c){return '<option value="'+c.id+'">'+esc(c.n)+'</option>'}).join('')+'</select><input id="rn" placeholder="Nom si elle n’est pas dans la liste" style="margin-top:8px" aria-label="Nom de la cliente">'+
 '<div class="row"><div><label for="rd">Date</label><input id="rd" type="date" value="'+ag.s+'"></div><div><label for="rh">Heure</label><input id="rh" type="time" value="14:00"></div></div>'+
 '<label for="rm">Prix prévu (€)</label><input id="rm" type="number" inputmode="decimal" min="0" step="0.5" value="'+(st.serv[0]?st.serv[0].p:'')+'">'+
 '<button class="btn" onclick="rdvAdd()">Ajouter au calendrier</button>';
}
function rdvPrice(){var s=st.serv.filter(function(x){return x.id==document.getElementById('rp').value})[0];if(s)document.getElementById('rm').value=s.p}
function rdvAdd(){
 var s=st.serv.filter(function(x){return x.id==document.getElementById('rp').value})[0],cv=document.getElementById('rc').value,c=cv?st.cli.filter(function(x){return x.id==cv})[0]:null,n=c?c.n:document.getElementById('rn').value.trim(),d=document.getElementById('rd').value,h=document.getElementById('rh').value,a=parseFloat(document.getElementById('rm').value);
 if(!s||!d||!h||!(a>=0)||!n){toast('Complétez prestation, cliente, date et heure');return}
 st.rdv.push({id:Date.now(),d:d,h:h,l:s.n,amt:a,n:n,c:c?c.id:null});ag.s=d;ag.m=new Date(+d.slice(0,4),+d.slice(5,7)-1,1);save();toast('Rendez-vous ajouté');render();
}
function rdvDone(id){
 var r=st.rdv.filter(function(x){return x.id==id})[0];if(!r)return;
 if(!r.c&&r.n){var f=st.cli.filter(function(c){return c.n.toLowerCase()==r.n.toLowerCase()})[0];if(!f){f={id:Date.now()+1,n:r.n,t:'',a:'',p:false};st.cli.push(f)}r.c=f.id}
 var o={id:Date.now(),l:r.l,amt:r.amt,d:r.d};if(r.c)o.c=r.c;st.inc.push(o);
 st.rdv=st.rdv.filter(function(x){return x.id!=id});save();toast('Prestation encaissée');render();
}
function rdvDel(id){st.rdv=st.rdv.filter(function(x){return x.id!=id});save();render()}
var newS=false,delB=false;
function addBulle(){var n=document.getElementById('sn2').value.trim(),p=parseFloat(document.getElementById('sp2').value);if(!n||!(p>=0)){toast('Indiquez un nom et un prix');return}st.serv.push({id:Date.now(),n:n,p:p,c:0,m:60});newS=false;save();toast('Prestation ajoutée');render()}
function delServ(id){st.serv=st.serv.filter(function(s){return s.id!=id});save();toast('Prestation supprimée');render()}
function addServ(){var n=document.getElementById('sn').value.trim();if(!n){toast('Indiquez un nom');return}st.serv.push({id:Date.now(),n:n,p:0,c:0,m:60});save();render()}
render();
</script>
